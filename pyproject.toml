[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaquacrop.preprocess"
version = "0.1.0b1"
description = "Automated data download and preprocessing pipeline for running FAO AquaCrop over large regions in gridded format"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "dask",
    "shapely",
    "requests",
    "geopandas",
    "rasterio",
    "pandas",
    "cdsapi",
    "netcdf4",
    "rioxarray",
    "owslib",
    "soilgrids",
    "dnspython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx>=7",
    "furo",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "download: marks tests that require live network access (deselect with '-m \"not download\"')",
]

[tool.coverage.run]
source = ["src/geoaquacrop_preprocess"]
omit = ["*/tests/*"]
