[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaquacrop_preprocess"
version = "0.1.0"
description = "Automated data download and preprocessing pipeline for running FAO AquaCrop over large regions in gridded format"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Josias Lang-Ritter" },
    { name = "Chris Bowden" },
    { name = "Seyed Hossein Hosseini" },
    { name = "Henrikki Tenkanen" },
    { name = "Tim Foster" },
    ]

maintainers = [
    { name = "Josias Lang-Ritter", email = "josias.lang-ritter@aalto.fi" },
]

dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "dask",
    "shapely",
    "requests",
    "geopandas",
    "rasterio",
    "pandas",
    "cdsapi",
    "netcdf4",
    "rioxarray",
    "owslib",
    "soilgrids",
    "dnspython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx>=7",
    "furo",
]

[project.urls]
Documentation = "https://geoaquacrop-preprocess.readthedocs.io/en/latest/"
Homepage = "https://github.com/aquacropos/geoaquacrop_preprocess"
Preprocessing = "https://github.com/aquacropos/geoaquacrop_preprocess"
Visualization = "https://github.com/aquacropos/geoaquacrop_visualize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "download: marks tests that require live network access (deselect with '-m \"not download\"')",
]

[tool.coverage.run]
source = ["src/geoaquacrop_preprocess"]
omit = ["*/tests/*"]
